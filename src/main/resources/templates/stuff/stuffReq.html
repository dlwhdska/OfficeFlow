<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link rel="stylesheet" href="/css/stuffReq.css">
</head>
<body>
	<form th:action="@{/stuff/stuffReq}" method="post" id="stuffReqForm">
		<div>
			사원이름 : 
			<input type="text" name="memberName" th:value="${session.loginMember.name}" readonly>
		</div>
		<div>
		    비품명:
		    <select name="stuffName" required>
		        <option value="">비품을 선택하세요</option>
		        <option value="노트북">노트북</option>
		        <option value="모니터">모니터</option>
		        <option value="키보드">키보드</option>
		        <option value="마우스">마우스</option>
		        <option value="프린터">프린터</option>
		        <option value="태블릿">태블릿</option>
		        <option value="헤드셋">헤드셋</option>
		        <option value="A4">A4</option>
		        <option value="B4">B4</option>
		        <option value="책상">책상</option>
		        <option value="의자">의자</option>
		    </select>
		</div>
		<div>
			요청수량 : 
			<input type="text" id="quantity" name="quantity">
			<div id="quantityError" class="error-message">
            </div>
		</div>
		<div>
			요청사유 : 
			<textarea rows="5" cols="30" id="purpose" name="purpose"></textarea>
			<div id="purposeError" class="error-message">
            </div>
		</div>
		<button type="submit">요청</button>
	</form>
	<script src="/js/stuff/stuffReq.js"></script>
</body>
</html>
